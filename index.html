<body>

<div id="creditos">
🎮 Código hecho por ChatGPT<br>

</div>

<style>
#creditos{
  position:fixed;
  top:80%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#020617;
  color:#22c55e;
  padding:15px 30px;
  font-size:16px;
  border-radius:12px;
  z-index:1000;
  box-shadow:0 0 15px #22c55e;
  text-align:center;
  opacity:1;
  transition:opacity 1s;
}
</style>

<h1>🎰 BLOX FRUITS BUILD MAKER 🎰</h1>
<div id="estado">Presiona START para comenzar</div>
<button id="btn" onclick="accion()">START</button>

<div class="container">
 <div class="card" id="melee" onclick="seleccionar('melee')"></div>
 <div class="card" id="fruit" onclick="seleccionar('fruit')"></div>
 <div class="card" id="sword" onclick="seleccionar('sword')"></div>
 <div class="card" id="gun" onclick="seleccionar('gun')"></div>
 <div class="card" id="race" onclick="seleccionar('race')"></div>
</div>

<div id="resultado"></div>

<script>
let estado="inicio"; // inicio | jugando | final
let bloqueado={melee:false,fruit:false,sword:false,gun:false,race:false};
let actual={};
let seleccionPendiente=true;

function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}

function mostrar(id,tipo,item){
 actual[id]=item;
 document.getElementById(id).innerHTML=`<div class='tipo'>${tipo}</div><h3>${item.name}</h3><img src='${item.img}'>`;
}

function seleccionar(tipo){
 if(estado!=="jugando")return;
 if(bloqueado[tipo])return;
 if(!seleccionPendiente)return;

 bloqueado[tipo]=true;
 seleccionPendiente=false;
 document.getElementById(tipo).classList.add('locked');
 girar();
}

function girar(){
 setTimeout(()=>{
  if(!bloqueado.melee)mostrar('melee','MELEE',pick(melees));
  if(!bloqueado.fruit)mostrar('fruit','FRUTA',pick(fruits));
  if(!bloqueado.sword)mostrar('sword','ESPADA',pick(swords));
  if(!bloqueado.gun)mostrar('gun','ARMA',pick(guns));
  if(!bloqueado.race)mostrar('race','RAZA V4',pick(races));
  seleccionPendiente=true;
  if(Object.values(bloqueado).every(v=>v))finalizar();
 },400);
}

function accion(){
 if(estado==="inicio"){
  estado="jugando";
  document.getElementById('btn').innerText="RESET";
  document.getElementById('estado').innerText="Selecciona un atributo";
  girar();
 } else {
  location.reload();
 }
}

function finalizar(){
 estado="final";
 document.getElementById('estado').innerText="Build final generada";
 let total=0;for(let k in actual)total+=actual[k].b;
 document.getElementById('resultado').style.display="block";
 document.getElementById('resultado').innerText=`BOUNTY TOTAL DE LA BUILD: ${total.toLocaleString()}`;
}

window.addEventListener('load', () => {
  const creditos = document.getElementById('creditos');
  setTimeout(() => {
    creditos.style.transition = "opacity 1s";
    creditos.style.opacity = 0;
    setTimeout(() => creditos.style.display = "none", 1000);
  }, 3000);
});
